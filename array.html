<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="hai"></div>
   <script>
    let x=['apple','banana','mango'];
    let a='<ul>'
        
        for (i=0;i<x.length;i++){
            a += '<li>' + a[i] + '<li>';
        }
        a +='<ul>';
        document.getElementById("hai").innerHTML=a;
   </script>
</body>
</html>
