<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="one"></div>
    <script>
       var a=['a','b','c'];
       a.push('d');
       a.pop();
       a.unshift('e');
       a.shift();
       document.getElementById('one').innerHTML=a;
    </script>
</body>
</html>
